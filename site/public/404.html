<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SSHub</title>
    <script>
      // GitHub Pages has no server-side routing, so a direct visit to a path
      // like /SSHub/guide lands here. Redirect it into index.html, encoding the
      // path in the query, and the restore snippet there puts it back.
      var pathSegmentsToKeep = 1; // keep the "/SSHub" project base
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
